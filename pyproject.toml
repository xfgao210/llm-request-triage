[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-request-triage"
version = "0.1.0"
description = "SLO-aware LLM request-triage simulation and evaluation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
rl = ["gymnasium>=0.29", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
