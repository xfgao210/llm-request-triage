[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-request-triage"
version = "0.1.0"
description = "SLO-aware LLM request-triage simulation and evaluation"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["llm_triage*", "triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
